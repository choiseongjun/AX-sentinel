server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/equipment {
        proxy_pass http://asset-service:8080;
    }

    location /api/v1/incidents {
        proxy_pass http://incident-service:8080;
    }

    location = /api/v1/telemetry/ws {
        proxy_pass http://incident-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/telemetry {
        proxy_pass http://incident-service:8080;
    }

    location /api/v1/analyses {
        proxy_pass http://ai-analysis-service:8080;
    }

    location /api/v1/documents {
        proxy_pass http://knowledge-service:8080;
    }

    location ~ ^/api/v1/(approvals|work-orders) {
        proxy_pass http://work-order-service:8080;
    }

    location ~ ^/api/v1/(feedback|metrics) {
        proxy_pass http://metrics-service:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
