name: axsentinel

x-app-environment: &app-environment
  ENVIRONMENT: local
  AUTH_MODE: disabled
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-hoangquan456/qwen3-nothink:4b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
  RAG_PROVIDER: local
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  DYNAMODB_TABLE: ${DYNAMODB_TABLE:-axsentinel-domain}
  DOCUMENTS_BUCKET: ${S3_BUCKET:-axsentinel-local}
  EVENTS_QUEUE: ${SQS_QUEUE:-axsentinel-events}
  EVENTS_DLQ: ${SQS_DLQ:-axsentinel-events-dlq}
  EVENT_BUS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP: ax-sentinel-event-worker-v1
  ALERTS_TOPIC: ${SNS_TOPIC:-axsentinel-alerts}
  DATABASE_THREAD_WORKERS: ${DATABASE_THREAD_WORKERS:-16}
  BROKER_THREAD_WORKERS: ${BROKER_THREAD_WORKERS:-8}
  AI_THREAD_WORKERS: ${AI_THREAD_WORKERS:-4}
  AUTHENTICATION_THREAD_WORKERS: ${AUTHENTICATION_THREAD_WORKERS:-8}
  STORAGE_THREAD_WORKERS: ${STORAGE_THREAD_WORKERS:-8}

x-app-base: &app-base
  restart: unless-stopped
  depends_on:
    localstack:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  environment: *app-environment
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  localstack:
    image: localstack/localstack-pro:${LOCALSTACK_VERSION:-latest}
    container_name: axsentinel-localstack
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      EAGER_SERVICE_LOADING: "1"
      PERSISTENCE: "1"
      SERVICES: s3,sqs,sns,dynamodb,secretsmanager,ecr,eks,ec2,iam,sts
      EKS_K8S_PROVIDER: k3s
      EKS_START_K3D_LB_INGRESS: "1"
      S3_BUCKET: ${S3_BUCKET:-axsentinel-local}
      SQS_QUEUE: ${SQS_QUEUE:-axsentinel-events}
      SQS_DLQ: ${SQS_DLQ:-axsentinel-events-dlq}
      SNS_TOPIC: ${SNS_TOPIC:-axsentinel-alerts}
      DYNAMODB_TABLES: >-
        axsentinel-asset axsentinel-incident axsentinel-analysis
        axsentinel-knowledge axsentinel-work-order axsentinel-metrics axsentinel-events
      SECRET_NAME: ${SECRET_NAME:-axsentinel/local}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/root/.kube
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4566/_localstack/health >/dev/null &&
          awslocal s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null &&
          awslocal secretsmanager describe-secret --secret-id "$${SECRET_NAME}" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    container_name: axsentinel-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - >-
        for topic in
        ax.telemetry.events.v1
        ax.incident.events.v1
        ax.analysis.events.v1
        ax.knowledge.events.v1
        ax.work-order.events.v1
        ax.feedback.events.v1
        ax.audit.events.v1;
        do
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic "$$topic"
        --partitions 3
        --replication-factor 1;
        done

  asset-service:
    <<: *app-base
    image: axsentinel/asset-service:local
    build:
      context: .
      args:
        SERVICE: asset
    environment:
      <<: *app-environment
      SERVICE_NAME: asset-service
      DYNAMODB_TABLE: axsentinel-asset
    ports:
      - "127.0.0.1:8101:8080"

  incident-service:
    <<: *app-base
    image: axsentinel/incident-service:local
    build:
      context: .
      args:
        SERVICE: incident
    environment:
      <<: *app-environment
      SERVICE_NAME: incident-service
      DYNAMODB_TABLE: axsentinel-incident
    ports:
      - "127.0.0.1:8102:8080"

  ai-analysis-service:
    <<: *app-base
    image: axsentinel/ai-analysis-service:local
    build:
      context: .
      args:
        SERVICE: ai_analysis
    environment:
      <<: *app-environment
      SERVICE_NAME: ai-analysis-service
      DYNAMODB_TABLE: axsentinel-analysis
      ASSET_SERVICE_URL: http://asset-service:8080
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8080
    ports:
      - "127.0.0.1:8103:8080"

  knowledge-service:
    <<: *app-base
    image: axsentinel/knowledge-service:local
    build:
      context: .
      args:
        SERVICE: knowledge
    environment:
      <<: *app-environment
      SERVICE_NAME: knowledge-service
      DYNAMODB_TABLE: axsentinel-knowledge
    ports:
      - "127.0.0.1:8104:8080"

  work-order-service:
    <<: *app-base
    image: axsentinel/work-order-service:local
    build:
      context: .
      args:
        SERVICE: work_order
    environment:
      <<: *app-environment
      SERVICE_NAME: work-order-service
      DYNAMODB_TABLE: axsentinel-work-order
      INCIDENT_SERVICE_URL: http://incident-service:8080
    ports:
      - "127.0.0.1:8105:8080"

  metrics-service:
    <<: *app-base
    image: axsentinel/metrics-service:local
    build:
      context: .
      args:
        SERVICE: metrics
    environment:
      <<: *app-environment
      SERVICE_NAME: metrics-service
      DYNAMODB_TABLE: axsentinel-metrics
      ANALYSIS_SERVICE_URL: http://ai-analysis-service:8080
      WORK_ORDER_SERVICE_URL: http://work-order-service:8080
    ports:
      - "127.0.0.1:8106:8080"

  event-worker:
    <<: *app-base
    image: axsentinel/event-worker:local
    build:
      context: .
      args:
        SERVICE: event_worker
    environment:
      <<: *app-environment
      SERVICE_NAME: event-worker
      DYNAMODB_TABLE: axsentinel-events
    ports:
      - "127.0.0.1:8107:8080"

  web:
    image: axsentinel/web:local
    build:
      context: ./web
    restart: unless-stopped
    environment:
      AUTH_MODE: disabled
      COGNITO_ISSUER: ""
      COGNITO_CLIENT_ID: ""
    depends_on:
      asset-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      ai-analysis-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      work-order-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      event-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  localstack-data:
    name: axsentinel-localstack-pro-data
  kafka-data:
    name: axsentinel-kafka-data
