global:
  imageRegistry: "000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566"
  imageTag: local
  imagePullPolicy: Always
  environment: local-eks
  awsRegion: ap-northeast-2
  awsEndpointUrl: http://host.docker.internal:4566
  awsAccessKeyId: test
  awsSecretAccessKey: test
  eventsQueue: axsentinel-events
  eventsDlq: axsentinel-events-dlq
  eventWaitTimeSeconds: 10
  alertsTopic: axsentinel-alerts
  websocketBroker: redis
  redisUrl: redis://redis:6379/0
  authMode: disabled
  aiProvider: mock
  ragProvider: local

services:
  - name: asset-service
    image: axsentinel/asset-service
    port: 8080
    replicas: 1
    path: /api/v1/equipment
  - name: incident-service
    image: axsentinel/incident-service
    port: 8080
    replicas: 1
    path: /api/v1/incidents
  - name: ai-analysis-service
    image: axsentinel/ai-analysis-service
    port: 8080
    replicas: 1
    path: /api/v1/analyses
  - name: knowledge-service
    image: axsentinel/knowledge-service
    port: 8080
    replicas: 1
    path: /api/v1/documents
  - name: work-order-service
    image: axsentinel/work-order-service
    port: 8080
    replicas: 1
    path: /api/v1/approvals
  - name: metrics-service
    image: axsentinel/metrics-service
    port: 8080
    replicas: 1
    path: /api/v1/metrics
  - name: event-worker
    image: axsentinel/event-worker
    port: 8080
    replicas: 1
    path: /api/v1/events

web:
  name: web
  image: axsentinel/web
  port: 80
  replicas: 1

ingress:
  enabled: true
  className: traefik
  host: localhost

autoscaling:
  enabled: false

redis:
  enabled: true
