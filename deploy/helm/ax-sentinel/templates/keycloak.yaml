{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-local-credentials
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "keycloak.adminPassword must be supplied at deploy time" .Values.keycloak.adminPassword | quote }}
  database-password: {{ required "keycloak.databasePassword must be supplied at deploy time" .Values.keycloak.databasePassword | quote }}
  system-admin-password: {{ required "keycloak.systemAdminPassword must be supplied at deploy time" .Values.keycloak.systemAdminPassword | quote }}
  manager-password: {{ required "keycloak.managerPassword must be supplied at deploy time" .Values.keycloak.managerPassword | quote }}
  worker-password: {{ required "keycloak.workerPassword must be supplied at deploy time" .Values.keycloak.workerPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
data:
  ax-sentinel-realm.json: |
{{ .Files.Get "files/keycloak-realm.json" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.keycloak.databaseStorage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/part-of: ax-sentinel
    spec:
      containers:
        - name: postgres
          image: {{ .Values.keycloak.postgresImage | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: database-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: ax-sentinel
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.keycloak.postgresImage | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h keycloak-postgres -U keycloak -d keycloak; do sleep 2; done
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: database-password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: admin-password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/keycloak"
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.externalBaseUrl | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/ax-sentinel-realm.json
              subPath: ax-sentinel-realm.json
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "keycloak-user-bootstrap-%d" .Release.Revision }}
  labels:
    {{- include "ax-sentinel.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-user-bootstrap
        app.kubernetes.io/part-of: ax-sentinel
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.keycloak.image | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh
              until "$KCADM" config credentials \
                --server http://keycloak:8080/keycloak \
                --realm master \
                --user "$KEYCLOAK_ADMIN" \
                --password "$KEYCLOAK_ADMIN_PASSWORD"; do
                sleep 3
              done

              "$KCADM" update realms/ax-sentinel \
                -s bruteForceProtected=true \
                -s eventsEnabled=true \
                -s eventsExpiration=2592000 \
                -s adminEventsEnabled=true \
                -s adminEventsDetailsEnabled=true \
                -s 'passwordPolicy=length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername(undefined)'
              client_json=$("$KCADM" get clients -r ax-sentinel \
                -q clientId=ax-sentinel-web --fields id)
              client_id=$(printf '%s' "$client_json" | \
                sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | head -1)
              if [ -n "$client_id" ]; then
                "$KCADM" update "clients/$client_id" -r ax-sentinel \
                  -s directAccessGrantsEnabled=false
              fi

              ensure_user() {
                username="$1"
                password="$2"
                role="$3"
                required_actions="$4"
                "$KCADM" create users -r ax-sentinel \
                  -s username="$username" \
                  -s enabled=true \
                  -s emailVerified=true >/dev/null 2>&1 || true
                "$KCADM" set-password -r ax-sentinel \
                  --username "$username" \
                  --new-password "$password"
                "$KCADM" add-roles -r ax-sentinel \
                  --uusername "$username" \
                  --rolename "$role" >/dev/null 2>&1 || true
                user_json=$("$KCADM" get users -r ax-sentinel \
                  -q exact=true -q username="$username" --fields id)
                user_id=$(printf '%s' "$user_json" | \
                  sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | head -1)
                if [ -n "$user_id" ]; then
                  "$KCADM" update "users/$user_id" -r ax-sentinel \
                    -s "requiredActions=$required_actions"
                fi
              }

              ensure_user admin "$SYSTEM_ADMIN_PASSWORD" system_admin \
                '["CONFIGURE_TOTP"]'
              ensure_user manager "$MANAGER_PASSWORD" operator_manager '[]'
              ensure_user worker "$WORKER_PASSWORD" field_worker '[]'
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUsername | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: admin-password
            - name: SYSTEM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: system-admin-password
            - name: MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: manager-password
            - name: WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-local-credentials
                  key: worker-password
{{- end }}
