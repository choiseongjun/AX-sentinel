global:
  imageRegistry: ""
  imageTag: latest
  imagePullPolicy: IfNotPresent
  environment: dev
  awsRegion: ap-northeast-2
  awsEndpointUrl: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  eventsQueue: ax-sentinel-dev-events
  eventsDlq: ax-sentinel-dev-events-dlq
  eventWaitTimeSeconds: 10
  eventBus: sqs
  kafkaBootstrapServers: ""
  kafkaConsumerGroup: ax-sentinel-event-worker-v1
  kafkaPublishTimeoutSeconds: 10
  kafkaMaxProcessingAttempts: 3
  alertsTopic: ax-sentinel-dev-alerts
  websocketBroker: memory
  redisUrl: ""
  authMode: cognito
  cognitoUserPoolId: ""
  cognitoClientId: ""
  aiProvider: bedrock
  ollamaBaseUrl: http://host.docker.internal:11434
  ollamaModel: hoangquan456/qwen3-nothink:4b
  ollamaTimeoutSeconds: 180
  bedrockModelId: ""
  bedrockGuardrailId: ""
  bedrockGuardrailVersion: ""
  ragProvider: bedrock
  bedrockKnowledgeBaseId: ""
  bedrockDataSourceId: ""
  databaseThreadWorkers: 16
  brokerThreadWorkers: 8
  aiThreadWorkers: 4
  authenticationThreadWorkers: 8
  storageThreadWorkers: 8

services:
  - name: asset-service
    image: axsentinel/asset-service
    table: axsentinel-asset
    port: 8080
    replicas: 2
    path: /api/v1/equipment
  - name: incident-service
    image: axsentinel/incident-service
    table: axsentinel-incident
    port: 8080
    replicas: 2
    path: /api/v1/incidents
  - name: ai-analysis-service
    image: axsentinel/ai-analysis-service
    table: axsentinel-analysis
    port: 8080
    replicas: 2
    path: /api/v1/analyses
  - name: knowledge-service
    image: axsentinel/knowledge-service
    table: axsentinel-knowledge
    port: 8080
    replicas: 2
    path: /api/v1/documents
  - name: work-order-service
    image: axsentinel/work-order-service
    table: axsentinel-work-order
    port: 8080
    replicas: 2
    path: /api/v1/approvals
  - name: metrics-service
    image: axsentinel/metrics-service
    table: axsentinel-metrics
    port: 8080
    replicas: 2
    path: /api/v1/metrics
  - name: event-worker
    image: axsentinel/event-worker
    table: axsentinel-events
    port: 8080
    replicas: 2
    path: /api/v1/events

web:
  name: web
  image: axsentinel/web
  port: 80
  replicas: 2

ingress:
  enabled: false
  className: alb
  host: api.dev.axsentinel.internal

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

redis:
  enabled: false
  image: redis:7-alpine

keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:26.7.0
  postgresImage: postgres:17-alpine
  adminUsername: keycloak-admin
  adminPassword: ""
  databasePassword: ""
  systemAdminPassword: ""
  managerPassword: ""
  workerPassword: ""
  databaseStorage: 2Gi
  realm: ax-sentinel
  clientId: ax-sentinel-web
  externalBaseUrl: ""
  internalBaseUrl: http://keycloak:8080/keycloak

kafka:
  enabled: false
  image: apache/kafka:3.9.1
  storage: 5Gi
  ui:
    enabled: false
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    username: admin
    password: ""
    contextPath: /kafka-ui

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
